x-control-plane-base: &control-plane-base
  image: netwatch-control-plane:latest
  restart: unless-stopped
  environment:
    DB_HOST: ${DB_HOST:-172.28.0.30}
    DB_PORT: ${DB_PORT:-5432}
    DB_NAME: ${POSTGRES_DB:-netwatch}
    DB_USER: ${POSTGRES_USER:-postgres}
    DB_PASSWORD: ${POSTGRES_PASSWORD:-netwatch_dev_pass}
    NATS_HOST: ${NATS_HOST:-172.28.0.31}
    NATS_PORT: ${NATS_PORT:-4222}
    NATS_CONTROL_PLANE_PASSWORD: ${NATS_CONTROL_PLANE_PASSWORD:-dev_cp_pass}
    NATS_URL: nats://control_plane:${NATS_CONTROL_PLANE_PASSWORD:-dev_cp_pass}@${NATS_HOST:-172.28.0.31}:${NATS_PORT:-4222}
    JOIN_TOKEN: ${JOIN_TOKEN:-netwatch-dev-join-token-2026}
  volumes:
    - ./certs:/app/certs:ro
    - ./agent:/app/agent:ro
    - ./shared:/app/shared:ro
    - ./control_plane:/app/control_plane:ro
  depends_on:
    timescaledb:
      condition: service_healthy
    nats:
      condition: service_healthy
  healthcheck:
    test: ["CMD", "python", "-c", "import sys; sys.exit(0)"]
    interval: 10s
    timeout: 3s
    retries: 3
    start_period: 30s

x-node-env: &node-env
  JOIN_TOKEN: ${JOIN_TOKEN:-netwatch-dev-join-token-2026}
  CP_1_ADDR: 172.28.0.32:50051
  CP_2_ADDR: 172.28.0.33:50051
  NATS_URL: nats://telemetry_agent:${NATS_TELEMETRY_AGENT_PASSWORD:-dev_agent_pass}@172.28.0.31:4222
  CA_CERT_PATH: /app/certs/ca.crt
  CERT_DIR: /var/lib/netwatch/certs

x-node-base: &node-base
  image: netwatch-agent:latest
  restart: unless-stopped
  cap_add:
    - NET_ADMIN
    - NET_RAW
  depends_on:
    control-plane-1:
      condition: service_healthy
    control-plane-2:
      condition: service_healthy
  volumes:
    - ./certs:/app/certs:ro
    - ./agent:/app/agent:ro
    - ./shared:/app/shared:ro
  healthcheck:
    test: ["CMD", "python", "-c", "import sys; sys.exit(0)"]
    interval: 10s
    timeout: 3s
    retries: 3
    start_period: 15s

services:
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: timescaledb
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-netwatch_dev_pass}
      POSTGRES_DB: ${POSTGRES_DB:-netwatch}
    command:
      - postgres
      - -c
      - tcp_keepalives_idle=10
      - -c
      - tcp_keepalives_interval=5
      - -c
      - tcp_keepalives_count=3
    volumes:
      - tsdb_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    networks:
      MGMT_NET:
        ipv4_address: 172.28.0.30
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-netwatch}"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 30s

  nats:
    image: nats:2.10-alpine
    container_name: nats-server-1
    restart: unless-stopped
    environment:
      NATS_CONTROL_PLANE_PASSWORD: ${NATS_CONTROL_PLANE_PASSWORD:-dev_cp_pass}
      NATS_TELEMETRY_AGENT_PASSWORD: ${NATS_TELEMETRY_AGENT_PASSWORD:-dev_agent_pass}
      NATS_WORKER_CONSUMER_PASSWORD: ${NATS_WORKER_CONSUMER_PASSWORD:-dev_worker_pass}
      NATS_READONLY_AUDITOR_PASSWORD: ${NATS_READONLY_AUDITOR_PASSWORD:-dev_auditor_pass}
    ports:
      - "8222:8222"
      - "4222:4222"
    volumes:
      - ./nats/nats-server.conf:/etc/nats/nats-server.conf:ro
      - jetstream_data:/data/jetstream
    command: ["-c", "/etc/nats/nats-server.conf"]
    networks:
      MGMT_NET:
        ipv4_address: 172.28.0.31
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8222/healthz?js-enabled-only=true"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 30s

  control-plane-1:
    <<: *control-plane-base
    build:
      context: .
      dockerfile: control_plane/Dockerfile
    container_name: control-plane-1
    environment:
      DB_HOST: ${DB_HOST:-172.28.0.30}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${POSTGRES_DB:-netwatch}
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-netwatch_dev_pass}
      NATS_HOST: ${NATS_HOST:-172.28.0.31}
      NATS_PORT: ${NATS_PORT:-4222}
      NATS_CONTROL_PLANE_PASSWORD: ${NATS_CONTROL_PLANE_PASSWORD:-dev_cp_pass}
      NATS_URL: nats://control_plane:${NATS_CONTROL_PLANE_PASSWORD:-dev_cp_pass}@${NATS_HOST:-172.28.0.31}:${NATS_PORT:-4222}
      JOIN_TOKEN: ${JOIN_TOKEN:-netwatch-dev-join-token-2026}
      INSTANCE_ID: control-plane-1
    networks:
      MGMT_NET:
        ipv4_address: 172.28.0.32

  control-plane-2:
    <<: *control-plane-base
    container_name: control-plane-2
    environment:
      DB_HOST: ${DB_HOST:-172.28.0.30}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${POSTGRES_DB:-netwatch}
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-netwatch_dev_pass}
      NATS_HOST: ${NATS_HOST:-172.28.0.31}
      NATS_PORT: ${NATS_PORT:-4222}
      NATS_CONTROL_PLANE_PASSWORD: ${NATS_CONTROL_PLANE_PASSWORD:-dev_cp_pass}
      NATS_URL: nats://control_plane:${NATS_CONTROL_PLANE_PASSWORD:-dev_cp_pass}@${NATS_HOST:-172.28.0.31}:${NATS_PORT:-4222}
      JOIN_TOKEN: ${JOIN_TOKEN:-netwatch-dev-join-token-2026}
      INSTANCE_ID: control-plane-2
    networks:
      MGMT_NET:
        ipv4_address: 172.28.0.33

  worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
    image: netwatch-worker:latest
    container_name: netwatch-worker
    restart: unless-stopped
    environment:
      DB_DSN: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-netwatch_dev_pass}@172.28.0.30:5432/${POSTGRES_DB:-netwatch}
      NATS_URL: nats://worker_consumer:${NATS_WORKER_CONSUMER_PASSWORD:-dev_worker_pass}@172.28.0.31:4222
    volumes:
      - ./worker:/app/worker:ro
      - ./shared:/app/shared:ro
    depends_on:
      timescaledb:
        condition: service_healthy
      nats:
        condition: service_healthy
      control-plane-1:
        condition: service_healthy
    networks:
      MGMT_NET:
        ipv4_address: 172.28.0.34


  node-1:
    <<: *node-base
    build:
      context: .
      dockerfile: agent/Dockerfile
    container_name: node-1
    hostname: node-1
    environment:
      <<: *node-env
      NODE_ID: node-1
      DATA_IP: 172.29.0.10
    networks:
      MGMT_NET:
        ipv4_address: 172.28.0.40
      DATA_NET:
        ipv4_address: 172.29.0.10

  node-2:
    <<: *node-base
    container_name: node-2
    hostname: node-2
    environment:
      <<: *node-env
      NODE_ID: node-2
      DATA_IP: 172.29.0.11
    networks:
      MGMT_NET:
        ipv4_address: 172.28.0.41
      DATA_NET:
        ipv4_address: 172.29.0.11

  node-3:
    <<: *node-base
    container_name: node-3
    hostname: node-3
    environment:
      <<: *node-env
      NODE_ID: node-3
      DATA_IP: 172.29.0.12
    networks:
      MGMT_NET:
        ipv4_address: 172.28.0.42
      DATA_NET:
        ipv4_address: 172.29.0.12

  node-4:
    <<: *node-base
    container_name: node-4
    hostname: node-4
    environment:
      <<: *node-env
      NODE_ID: node-4
      DATA_IP: 172.29.0.13
    networks:
      MGMT_NET:
        ipv4_address: 172.28.0.43
      DATA_NET:
        ipv4_address: 172.29.0.13

  node-5:
    <<: *node-base
    container_name: node-5
    hostname: node-5
    environment:
      <<: *node-env
      NODE_ID: node-5
      DATA_IP: 172.29.0.14
    networks:
      MGMT_NET:
        ipv4_address: 172.28.0.44
      DATA_NET:
        ipv4_address: 172.29.0.14

volumes:
  tsdb_data:
  jetstream_data:

networks:
  MGMT_NET:
    name: mgmt_net
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/24
          gateway: 172.28.0.1

  DATA_NET:
    name: data_net
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.29.0.0/24
          gateway: 172.29.0.1