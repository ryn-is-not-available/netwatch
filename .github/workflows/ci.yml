name: CI

on:
  push:
  pull_request:

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: pytest -q --cov=agent --cov=control_plane --cov=worker --cov=ai_worker --cov-report=term

  stack:
    name: Full-stack smoke and fault injection
    runs-on: ubuntu-latest
    needs: unit
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Boot the stack
        run: docker compose up -d --build

      - name: Wait for all 5 nodes to be healthy
        run: |
          token=$(curl -fsS --retry 30 --retry-delay 3 --retry-all-errors -X POST localhost:8000/auth/token \
            -H 'Content-Type: application/json' -d '{"subject":"ci","role":"viewer"}' \
            | python3 -c 'import sys, json; print(json.load(sys.stdin)["access_token"])')
          for i in $(seq 1 60); do
            healthy=$(curl -fsS -H "Authorization: Bearer $token" localhost:8000/nodes \
              | python3 -c 'import sys, json; print(sum(n["health_status"] == "healthy" for n in json.load(sys.stdin)))' || echo 0)
            echo "healthy nodes: $healthy"
            [ "$healthy" = "5" ] && exit 0
            sleep 3
          done
          exit 1

      - name: Container health
        run: |
          for i in $(seq 1 40); do
            pending=$(docker compose ps --format '{{.Name}} {{.Health}}' | awk '$2 != "" && $2 != "healthy"')
            [ -z "$pending" ] && { docker compose ps -a; exit 0; }
            echo "waiting on: $pending"
            sleep 3
          done
          docker compose ps -a
          exit 1

      - name: Fault injection (stop node-1, check eviction, alerting, recovery)
        shell: pwsh
        run: ./scripts/verify_fault_injection.ps1

      - name: Logs on failure
        if: failure()
        run: docker compose logs --tail 150

      - name: Tear down
        if: always()
        run: docker compose down -v
