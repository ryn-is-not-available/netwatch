# NetWatch nodes: permanent read-only SNMPv2c agent, the classic monitoring baseline (planning S2).
# Scraped by snmp_exporter -> Prometheus (S3). Nodes are otherwise outbound-only; this is the one
# listening service, so it is locked down:
#  - answers only requests from MGMT_NET (172.28.0.0/24), never from DATA_NET;
#  - read-only community, restricted to the system, interface and host-resource subtrees.
agentAddress udp:161

# Allowed subtrees (snmpd has no end-of-line comments, so they are listed here):
#   .1.3.6.1.2.1.1     SNMPv2-MIB system (sysUpTime, sysName, ...)
#   .1.3.6.1.2.1.2     IF-MIB ifTable (status, errors, 32-bit counters)
#   .1.3.6.1.2.1.31    IF-MIB ifXTable (ifName, 64-bit counters, speed)
#   .1.3.6.1.4.1.2021  UCD-SNMP: CPU, memory, load
view   netwatch  included  .1.3.6.1.2.1.1
view   netwatch  included  .1.3.6.1.2.1.2
view   netwatch  included  .1.3.6.1.2.1.31
view   netwatch  included  .1.3.6.1.4.1.2021

rocommunity  public  172.28.0.0/24  -V netwatch

sysLocation  NetWatch lab (MGMT_NET)
sysContact   netwatch-admin
