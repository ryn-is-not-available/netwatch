# nats/nats-server.conf
server_name: "netwatch-nats-1"

port: 4222
http_port: 8222

# JetStream persistence & resource bounds
jetstream {
  store_dir: "/data/jetstream"
  max_mem: 1G
  max_file: 10G
}

# Subject ACLs (principle of least privilege)
# Wildcards: * = single token, > = multi-token tail
authorization {
  users = [
    # 1. Control Plane: orchestrates topology, issues commands/alerts, manages JetStream streams/consumers
    {
      user: "control_plane"
      password: "${NATS_CONTROL_PLANE_PASSWORD}"
      permissions: {
        publish: {
          allow: [
            "alerts.>",
            "topology.>",
            "commands.>",
            "$JS.API.>"
          ]
        }
        subscribe: {
          allow: [
            "telemetry.>",
            "alerts.>",
            "topology.>",
            "commands.>",
            "_INBOX.>"
          ]
        }
      }
    },

    # 2. Telemetry Agent / Collector: publishes telemetry & topology updates only;
    #    cannot forge alerts or commands, and cannot inspect all internal traffic
    {
      user: "telemetry_agent"
      password: "${NATS_TELEMETRY_AGENT_PASSWORD}"
      permissions: {
        publish: {
          allow: [
            "telemetry.>",
            "topology.>"
          ]
        }
        subscribe: {
          allow: [
            "_INBOX.>"
          ]
        }
      }
    },

    # 3. Worker Consumer: reads telemetry/alerts/topology, receives targeted commands,
    #    and uses JetStream API + _INBOX.> for pull/push consumer coordination;
    #    cannot publish to alerts.> or commands.>
    {
      user: "worker_consumer"
      password: "${NATS_WORKER_CONSUMER_PASSWORD}"
      permissions: {
        publish: {
          allow: [
            "telemetry.status.>",
            "$JS.API.>"
          ]
        }
        subscribe: {
          allow: [
            "telemetry.>",
            "alerts.>",
            "topology.>",
            "commands.worker.>",
            "_INBOX.>"
          ]
        }
      }
    },

    # 4. Read-Only / Observability Auditor: can observe streams/events without mutating control state
    {
      user: "readonly_auditor"
      password: "${NATS_READONLY_AUDITOR_PASSWORD}"
      permissions: {
        publish: {
          allow: [
            "$JS.API.STREAM.INFO",
            "$JS.API.STREAM.LIST",
            "$JS.API.CONSUMER.INFO",
            "$JS.API.CONSUMER.LIST"
          ]
        }
        subscribe: {
          allow: [
            "telemetry.>",
            "alerts.>",
            "topology.>",
            "_INBOX.>"
          ]
        }
      }
    }
  ]
}