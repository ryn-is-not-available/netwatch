<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in · NetWatch</title>
<link rel="stylesheet" href="/ui/css/styles.css">
</head>
<body class="login-page">
<main class="login-card">
  <div class="brand"><svg width="22" height="22" viewBox="0 0 20 20" aria-hidden="true"><circle cx="4" cy="10" r="2.5"/><circle cx="16" cy="4" r="2.5"/><circle cx="16" cy="16" r="2.5"/><path d="M6 9l8-4M6 11l8 4" stroke="currentColor" fill="none" stroke-width="1.5"/></svg>NetWatch</div>
  <form id="loginForm">
    <h1>Sign in</h1>
    <label>Username <input id="loginUser" name="username" autocomplete="username" required autofocus></label>
    <label>Password <input id="loginPass" name="password" type="password" autocomplete="current-password" required></label>
    <p id="loginErr" class="login-err" role="alert" hidden></p>
    <button class="primary" type="submit">Sign in</button>
  </form>
</main>
<script type="module" src="/ui/js/login.js"></script>
</body>
</html>
