<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NetWatch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/ui/css/styles.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.30.2/cytoscape.min.js"></script>
</head>
<body>
<header class="top">
  <div class="brand"><svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><circle cx="4" cy="10" r="2.5"/><circle cx="16" cy="4" r="2.5"/><circle cx="16" cy="16" r="2.5"/><path d="M6 9l8-4M6 11l8 4" stroke="currentColor" fill="none" stroke-width="1.5"/></svg>NetWatch</div>
  <span id="leader" class="pill">Connecting…</span>
  <span id="mode" class="pill live">Live</span>
  <label class="role">Role
    <select id="role"><option>admin</option><option>operator</option><option>viewer</option></select>
  </label>
</header>

<div class="actions">
  <fieldset><legend>Trace path</legend>
    <select id="src" aria-label="Source"></select><span aria-hidden="true">to</span><select id="dst" aria-label="Destination"></select>
    <button id="traceBtn" class="primary">Run trace</button>
  </fieldset>
  <fieldset><legend>Analysis</legend><button id="diagBtn">Diagnose drift</button></fieldset>
  <fieldset><legend>Node control</legend>
    <select id="revokeSel" aria-label="Node to revoke"></select><button id="revokeBtn" class="danger">Revoke</button>
  </fieldset>
</div>

<main class="main">
  <section class="stage">
    <div id="cy" role="img" aria-label="Network topology graph"></div>
    <div id="empty" class="empty" hidden>No nodes in this snapshot.</div>
    <div class="legend">
      <span><i class="ln dec"></i>Declared</span><span><i class="ln obs"></i>Observed</span>
      <span><i class="ln drift"></i>Drift</span><span><i class="ln trace"></i>Traced</span>
    </div>
    <div class="zoom"><button id="fit" title="Fit to view" aria-label="Fit to view">Fit</button><button id="relayout" title="Re-run layout">Relayout</button></div>
    <div id="inspector" class="inspector" hidden></div>
    <div class="timebar">
      <b>History</b>
      <input id="slider" type="range" min="-30" max="0" step="1" value="0" aria-label="Minutes before now">
      <output id="timeLabel">Now</output>
      <button id="liveBtn">Back to live</button>
    </div>
  </section>

  <aside class="side">
    <div id="trace" class="trace"><div class="trace-head"><b>Path trace</b><span id="traceState" class="pill">idle</span></div><div id="traceBody" class="muted">Pick two nodes and run a trace.</div></div>
    <div class="tabs" role="tablist">
      <button role="tab" data-tab="drift" aria-selected="true">Drift <i id="n-drift">0</i></button>
      <button role="tab" data-tab="recs" aria-selected="false">Fixes <i id="n-recs">0</i></button>
      <button role="tab" data-tab="alerts" aria-selected="false">Alerts <i id="n-alerts">0</i></button>
      <button role="tab" data-tab="audit" aria-selected="false">Audit</button>
    </div>
    <div id="panel" class="panel" role="tabpanel"></div>
  </aside>
</main>
<div id="toasts" class="toasts" aria-live="polite"></div>
<script type="module" src="/ui/js/main.js"></script>
</body>
</html>
