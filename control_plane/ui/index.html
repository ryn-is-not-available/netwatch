<!DOCTYPE html>
<html lang="en">
<head>
<script>
  // No session: go to the sign-in page before anything of the console is drawn.
  if (!sessionStorage.getItem("netwatch_token")) location.replace("/login");
</script>
<style>body:not(.authed){visibility:hidden}</style>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NetWatch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/ui/css/styles.css">
<link rel="stylesheet" href="/ui/css/shell.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.30.2/cytoscape.min.js"></script>
</head>
<body class="shell">
<header class="top">
  <div class="brand"><svg width="22" height="22" viewBox="0 0 20 20" aria-hidden="true"><circle cx="4" cy="10" r="2.5"/><circle cx="16" cy="4" r="2.5"/><circle cx="16" cy="16" r="2.5"/><path d="M6 9l8-4M6 11l8 4" stroke="currentColor" fill="none" stroke-width="1.5"/></svg>NetWatch</div>
  <div class="status-pill" role="status">
    <span id="overall" class="status-badge">Connecting…</span>
    <span id="leader" class="conn" title="Which control plane this page talks to"></span>
    <span id="mode" class="live-tag">Live</span>
  </div>
  <div class="account">
    <span id="who" class="avatar" hidden></span>
    <button id="logoutBtn" class="link-btn" hidden>Sign out</button>
  </div>
</header>

<nav class="tabs rail" role="tablist" aria-label="Views">
  <button role="tab" data-tab="drift" aria-selected="true" title="Overview: drift between declared and observed topology">
    <svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg><span>Overview</span><i id="n-drift">0</i></button>
  <button role="tab" data-tab="topo" aria-selected="false" title="Edit the declared topology">
    <svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="2.5"/><circle cx="19" cy="5" r="2.5"/><circle cx="19" cy="19" r="2.5"/><path d="M7.3 11l9.4-5M7.3 13l9.4 5"/></svg><span>Topology</span></button>
  <button role="tab" data-tab="alerts" aria-selected="false">
    <svg viewBox="0 0 24 24"><path d="M6 17V11a6 6 0 0 1 12 0v6l2 2H4zM10 21h4"/></svg><span>Alerts</span><i id="n-alerts">0</i></button>
  <button role="tab" data-tab="recs" aria-selected="false">
    <svg viewBox="0 0 24 24"><path d="M14 4l6 6-10 10H4v-6zM12 6l6 6"/></svg><span>Fixes</span><i id="n-recs">0</i></button>
  <button role="tab" data-tab="node" aria-selected="false" title="Details and charts of the selected node">
    <svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M8 15l3-3 2 2 3-4"/></svg><span>Node</span></button>
  <button role="tab" data-tab="audit" aria-selected="false">
    <svg viewBox="0 0 24 24"><path d="M6 3h9l4 4v14H6zM9 11h7M9 15h7M9 7h4"/></svg><span>Audit</span></button>
  <button role="tab" data-tab="users" id="usersTab" aria-selected="false" hidden>
    <svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M3 20a6 6 0 0 1 12 0M16 4.5a3.5 3.5 0 0 1 0 7M18 14a6 6 0 0 1 3 6"/></svg><span>Users</span></button>
</nav>

<main class="stage">
  <div id="cy" role="img" aria-label="Network topology graph"></div>
  <div id="empty" class="empty" hidden>No nodes in this snapshot.</div>
  <div id="edgeTip" class="edge-tip" hidden></div>

  <div class="toolbar glass">
    <div class="toolbar-row">
      <div class="group"><span class="group-label">Trace path</span>
        <div class="controls"><select id="src" aria-label="Source"></select><span aria-hidden="true">to</span><select id="dst" aria-label="Destination"></select>
          <button id="traceBtn" class="primary">Run trace</button></div></div>
      <span class="divider" aria-hidden="true"></span>
      <div class="group"><span class="group-label">Analysis</span>
        <div class="controls"><button id="diagBtn">Diagnose drift</button><button id="aiBtn" class="ai" title="Ask Gemini to explain the current state, citing the evidence">AI diagnose</button></div></div>
    </div>
    <div class="legend">
      <span><i class="ln obs"></i>Healthy</span><span><i class="ln warn"></i>Degraded</span>
      <span><i class="ln drift"></i>Missing</span><span><i class="ln dec"></i>Undeclared</span><span><i class="ln trace"></i>Traced</span>
    </div>
  </div>

  <aside class="side glass">
    <div id="trace" class="trace"><div class="trace-head"><b>Path trace</b><span id="traceState" class="pill">idle</span></div><div id="traceBody" class="muted">Pick two nodes and run a trace.</div></div>
    <section id="summary" class="summary" aria-label="Network status at a glance"></section>
    <div id="panel" class="panel" role="tabpanel"></div>
  </aside>

  <p class="hint">Click a node for details · hover a line for latency and loss</p>
  <div class="zoom">
    <div class="zoom-stack"><button id="zoomIn" aria-label="Zoom in">+</button><button id="zoomOut" aria-label="Zoom out">−</button></div>
    <div class="zoom-row"><button id="fit" title="Fit to view" aria-label="Fit to view">Fit</button><button id="relayout" title="Re-run layout">Relayout</button></div>
  </div>

  <div class="timebar">
    <select id="histRange" aria-label="History range"><option value="30">30 min</option><option value="360">6 h</option><option value="1440">24 h</option></select>
    <div class="timeline"><input id="slider" type="range" min="-30" max="0" step="1" value="0" aria-label="Minutes before now"><div class="ticks" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i></div></div>
    <output id="timeLabel">Now</output>
    <label class="known" id="knownLabel" hidden title="Checked: the map exactly as it looked at that moment. Unchecked: that moment with everything NetWatch learned afterwards (e.g. faults confirmed later)."><input id="knownThen" type="checkbox" checked> As seen at the time</label>
    <button id="liveBtn" hidden>Back to live</button>
  </div>
</main>

<dialog id="aiDlg" class="ai-dlg" aria-labelledby="aiDlgTitle">
  <div class="ai-dlg-head"><h2 id="aiDlgTitle">AI diagnosis</h2><button id="aiDlgClose" class="ai-dlg-x" aria-label="Close">✕</button></div>
  <p id="aiDlgMeta" class="ai-dlg-meta"></p>
  <div id="aiDlgBody" class="ai-dlg-body" aria-live="polite"></div>
  <div class="ai-dlg-foot"><button id="aiDlgFixes" class="primary">Open Fixes</button><button id="aiDlgRetry" hidden>Try again</button><button id="aiDlgOk">Close</button></div>
</dialog>
<div id="toasts" class="toasts" aria-live="polite"></div>
<script type="module" src="/ui/js/main.js"></script>
</body>
</html>
